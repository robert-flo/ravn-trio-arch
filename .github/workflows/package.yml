name: Package from vendored source

# Empaquetado y publicación del .pkg de ravn-trio (issue #9), con el patrón
# que ya funciona en pj-domina-rf-git-setup-arch. La diferencia de este repo:
# el tarball vendoreado ES la fuente, así que no hay checkout de otro repo ni
# derivación de versión: makepkg construye el PKGBUILD tal cual (la versión
# vive en el PKGBUILD y sube con cada release), el .pkg se prueba instalado
# y, en repository_dispatch, entra al canal stable de omarchy-personal-repo
# con el toolkit de omarchy-pkgs (bin/publish-artifact contra un remote
# rclone local, el mismo patrón de release-personal.yml). workflow_dispatch
# permite repetirlo a mano: construye e instala pero NO publica.

on:
  repository_dispatch:
    types:
      - source-updated
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  package:
    name: Build, install-test and publish the package
    # Dos dispatches no deben pisarse el push a gh-pages: la fila
    # serializa los runs del repo.
    concurrency:
      group: package-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
    steps:
      # Primer paso: archlinux:base no trae git, y sin git actions/checkout
      # cae al fallback REST que baja el arbol sin historial (lección del
      # primer run real en el repo del patrón, y el mismo orden de ci.yml).
      - name: Install build and runtime dependencies
        run: |
          set -euo pipefail

          pacman -Syu --noconfirm base-devel git github-cli gnupg openssh jq libnotify

      - name: Checkout this package repository
        uses: actions/checkout@v4

      - name: Stage the build directory
        env:
          PKG_BUILD: ${{ github.workspace }}/build
        run: |
          set -euo pipefail

          # El tarball vendoreado es la fuente: exactamente uno, y el
          # PKGBUILD debe declararlo (un release viejo olvidado se nota acá,
          # no en makepkg).
          tarballs=( ravn-trio-*.tar.gz )
          if (( ${#tarballs[@]} != 1 )) || [[ ! -e "${tarballs[0]}" ]]; then
            echo "no quedó exactamente un tarball vendoreado en la raíz del repo" >&2
            exit 1
          fi
          # El PKGBUILD declara el source parametrizado
          # ("${pkgname}-${pkgver}.tar.gz"): la guardia deriva el nombre
          # esperado de pkgver, no de un literal.
          pkgver="$(awk -F= '/^pkgver=/{print $2; exit}' PKGBUILD)"
          [[ "${tarballs[0]}" == "ravn-trio-${pkgver}.tar.gz" ]] || {
            echo "el tarball vendoreado no coincide con pkgver del PKGBUILD: ${tarballs[0]} vs ravn-trio-${pkgver}.tar.gz" >&2
            exit 1
          }

          mkdir -p "${PKG_BUILD}"
          cp PKGBUILD "${tarballs[0]}" "${PKG_BUILD}/"

      - name: Build the package and install-test it
        id: build
        env:
          PKG_BUILD: ${{ github.workspace }}/build
        run: |
          set -euo pipefail

          useradd --create-home builder
          chown -R builder:builder "${PKG_BUILD}"
          # herdr solo existe en omarchy-personal-repo: makepkg sin chequear
          # dependencias, igual que tests/lib/container-validate.sh.
          ( cd "${PKG_BUILD}" && su builder -c "makepkg --nodeps" )

          pkg_files=( "${PKG_BUILD}"/ravn-trio-*.pkg.tar.zst )
          if (( ${#pkg_files[@]} != 1 )) || [[ ! -e "${pkg_files[0]}" ]]; then
            echo "no quedó exactamente un .pkg.tar.zst en ${PKG_BUILD}" >&2
            exit 1
          fi

          pacman -U --noconfirm --nodeps --nodeps "${pkg_files[0]}"

          # Smoke del payload instalado: el mismo contrato que
          # phase_verify_payload y phase_verify_help_command de
          # tests/lib/container-validate.sh.
          share=/usr/share/ravn/trio
          test -L /usr/bin/pj-trio
          test "$(readlink /usr/bin/pj-trio)" = "$share/pj-trio"
          test -x "$share/pj-trio"
          test -x "$share/trio-status"
          test -x "$share/runtime/scripts/start"
          test -x "$share/runtime/plugin/new-trio"
          test -f "$share/trio-pm-prompt.md"
          test -f "$share/trio.conf.example"
          grep -Fxq 'id = "ravn.trio"' "$share/herdr-plugin.toml"
          test -f /usr/share/licenses/ravn-trio/LICENSE
          test -e /usr/share/bash-completion/completions/pj-trio
          pacman -Qkk ravn-trio > /dev/null

          test_home=/tmp/ravn-trio-package-test
          mkdir -p "$test_home"
          NO_COLOR=1 HOME="$test_home" TERM=dumb /usr/bin/pj-trio help > /tmp/pj-trio-help-output
          grep -Fq 'COMMANDS' /tmp/pj-trio-help-output
          grep -Fq 'start' /tmp/pj-trio-help-output

          pkgver="$(bsdtar -xOf "${pkg_files[0]}" .PKGINFO | awk -F' = ' '$1=="pkgver"{print $2; exit}')"
          printf 'versión construida: %s\n' "$pkgver"
          {
            printf 'pkgver=%s\n' "$pkgver"
          } >> "${GITHUB_OUTPUT}"
          echo "instalación verificada: /usr/bin/pj-trio, payload en $share y help corriendo"

      - name: Upload the package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ravn-trio-${{ steps.build.outputs.pkgver }}
          path: build/*.pkg.tar.zst
          if-no-files-found: error

      # ------------------------------------------------------------------ #
      # Publicación: el .pkg construido e instalado entra al canal stable  #
      # del repo personal (gh-pages de omarchy-personal-repo) con el       #
      # toolkit de omarchy-pkgs: bin/publish-artifact firma y corre        #
      # repo-add contra el db del canal. La poda mantiene los últimos N    #
      # paquetes por pkgname (N=5, aquí por versión, no por contador .r:   #
      # este repo publica versiones simples) y bin/unpublish-packages      #
      # retira del db lo que la poda ya no sirve. Credenciales solo en     #
      # secrets de este repo: SSH_DEPLOY_KEY (deploy key de                #
      # omarchy-personal-repo), GPG_PRIVATE_KEY y GPG_PASSPHRASE (la clave #
      # de firma del repo). Publica repository_dispatch; el dogfooding por #
      # workflow_dispatch construye e instala pero NO publica.             #
      # ------------------------------------------------------------------ #
      - name: Install the publish tooling
        if: github.event_name == 'repository_dispatch'
        run: |
          set -euo pipefail

          pacman -S --noconfirm --needed rclone zstd

      - name: Checkout the omarchy-pkgs publish tooling
        if: github.event_name == 'repository_dispatch'
        uses: actions/checkout@v4
        with:
          repository: robert-flo/omarchy-pkgs
          ref: personal
          path: omarchy-pkgs

      - name: Checkout the personal repo (gh-pages)
        if: github.event_name == 'repository_dispatch'
        uses: actions/checkout@v4
        with:
          repository: robert-flo/omarchy-personal-repo
          ref: gh-pages
          path: repo
          ssh-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: Publish the package into the stable channel
        id: publish
        if: github.event_name == 'repository_dispatch'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          pkg_files=( build/*.pkg.tar.zst )
          if (( ${#pkg_files[@]} != 1 )) || [[ ! -e "${pkg_files[0]}" ]]; then
            echo "no quedó exactamente un .pkg.tar.zst para publicar" >&2
            exit 1
          fi
          pkgfile="${pkg_files[0]}"
          pkgname="$(bsdtar -xOf "$pkgfile" .PKGINFO | awk -F' = ' '$1=="pkgname"{print $2; exit}')"
          pkgbase="$(bsdtar -xOf "$pkgfile" .PKGINFO | awk -F' = ' '$1=="pkgbase"{print $2; exit}')"
          pkgbase="${pkgbase:-$pkgname}"
          [[ -n "$pkgname" ]] || { echo "el .PKGINFO no trae pkgname" >&2; exit 1; }

          bash omarchy-pkgs/bin/publish-artifact --remote "$GITHUB_WORKSPACE/repo" --mirror stable --arch x86_64 "$pkgfile"

          {
            printf 'pkgname=%s\n' "$pkgname"
            printf 'pkgbase=%s\n' "$pkgbase"
          } >> "${GITHUB_OUTPUT}"

      - name: Prune the channel to the last N packages
        if: github.event_name == 'repository_dispatch'
        env:
          REPO_DIR: ${{ github.workspace }}/repo
          PKG_NAMES: ${{ steps.publish.outputs.pkgname }}
          PKG_BASES: ${{ steps.publish.outputs.pkgbase }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          REPO_DIR="${REPO_DIR:?}"
          PKG_NAMES="${PKG_NAMES:?}"
          PKG_BASES="${PKG_BASES:?}"
          KEEP_N="${PRUNE_KEEP_N:-5}"
          CHANNEL="$REPO_DIR/stable/x86_64"
          DB="$CHANNEL/omarchy.db.tar.zst"
          [[ -f "$DB" ]] || { echo "no hay db en $DB" >&2; exit 1; }
          [[ $KEEP_N =~ ^[0-9]+$ ]] || { echo "PRUNE_KEEP_N no es un número: $KEEP_N" >&2; exit 1; }

          db_filenames() {
            # GNU tar autodetecta la compresión del db (zstd en el canal
            # real; el fixture del test también la resuelve).
            tar -xO -f "$DB" --wildcards '*/desc' 2>/dev/null |
              awk '/^%FILENAME%$/{getline; print}'
          }

          db_files="$(db_filenames | sort -u)"
          for pkgname in $PKG_NAMES; do
            # Este repo publica versiones simples (ravn-trio-0.1.3-1-…),
            # no el esquema <base>.r<N>.<sha>: la ventana se ordena por
            # versión (sort -V, así 0.1.10 queda más nueva que 0.1.9).
            mapfile -t versions < <(
              cd "$CHANNEL" &&
              for f in $(ls -1 | grep -E "^${pkgname}-[0-9][0-9a-zA-Z.]*-[0-9]+-x86_64\.pkg\.tar\.zst$" || true); do
                printf '%s\n' "$f"
              done | sort -Vr
            )
            total=${#versions[@]}
            kept=0
            to_delete=()
            for line in "${versions[@]}"; do
              kept=$(( kept + 1 ))
              if (( kept > KEEP_N )); then
                to_delete+=( "$line" )
              fi
            done
            if (( ${#to_delete[@]} == 0 )); then
              echo "$pkgname: $total paquetes, dentro de la ventana de $KEEP_N; nada que podar"
              continue
            fi
            newest="${versions[0]}"
            danger="$(comm -12 <(printf '%s\n' "${to_delete[@]}" | sort -u) <(printf '%s\n' "$db_files"))"
            if [[ -n "$danger" ]]; then
              echo "la poda tocaría archivos que el db todavía sirve:" >&2
              printf '%s\n' "$danger" >&2
              # Mecanismo del db (bin/unpublish-packages): retira las entradas
              # del pkgbase (split y -debug incluidos) y bin/publish-artifact
              # re-agrega la más nueva, así el db sirve exactamente lo que
              # queda en el árbol.
              bash omarchy-pkgs/bin/unpublish-packages --remote "$REPO_DIR" --mirror stable --arch x86_64 $PKG_BASES
              bash omarchy-pkgs/bin/publish-artifact --remote "$REPO_DIR" --mirror stable --arch x86_64 "$CHANNEL/$newest"
              db_files="$(db_filenames | sort -u)"
            fi
            for f in "${to_delete[@]}"; do
              if grep -qxF "$f" <<<"$db_files"; then
                echo "salto $f: el db todavía lo sirve" >&2
                continue
              fi
              rm -f "$CHANNEL/$f" "$CHANNEL/$f.sig"
              echo "podado: $f"
            done
          done
          echo "poda lista: últimos $KEEP_N paquetes por pkgname en stable/x86_64"

      - name: Sign the databases and push gh-pages
        if: github.event_name == 'repository_dispatch'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          PKG_NAME: ${{ steps.publish.outputs.pkgname }}
          PKG_VER: ${{ steps.build.outputs.pkgver }}
        run: |
          set -euo pipefail

          cd repo
          # GitHub Pages no sirve symlinks: el db y los files van como copias.
          for f in stable/x86_64/omarchy.db stable/x86_64/omarchy.files; do
            if [[ -L "$f" ]]; then
              rl="$(readlink "$f")"
              rm -f "$f"
              cp -L "$(dirname "$f")/$rl" "$f"
            fi
          done
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --quiet --import <<<"$GPG_PRIVATE_KEY"
          gpg --batch --yes --detach-sign --armor --output stable/x86_64/omarchy.db.sig stable/x86_64/omarchy.db
          gpg --batch --yes --detach-sign --armor --output stable/x86_64/omarchy.files.sig stable/x86_64/omarchy.files
          # El pacman.conf del fork usa la sección [omarchy-personal]: el db
          # se publica también con ese nombre para que el repo sombreado
          # resuelva.
          cp stable/x86_64/omarchy.db stable/x86_64/omarchy-personal.db
          cp stable/x86_64/omarchy.files stable/x86_64/omarchy-personal.files
          gpg --batch --yes --detach-sign --armor --output stable/x86_64/omarchy-personal.db.sig stable/x86_64/omarchy-personal.db
          gpg --batch --yes --detach-sign --armor --output stable/x86_64/omarchy-personal.files.sig stable/x86_64/omarchy-personal.files
          rm -rf "$GNUPGHOME"
          git config user.name "Roberto Flores"
          git config user.email "25asab015@ujmd.edu.sv"
          git add -A
          if git diff --cached --quiet; then
            echo "sin cambios en gh-pages: el canal ya sirve esta versión"
          else
            git commit -m "publish: ${PKG_NAME} ${PKG_VER}"
            git push origin gh-pages
          fi

      # Fallo de build, prueba o publicación → issue automático en este repo
      # con el log del run como artifact. Sin label: este repo solo tiene
      # labels estándar de GitHub, así que el issue va sin label. Dedupe por título.
      - name: Collect the failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh run view -R "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" --log-failed > failed-package.log 2>&1 || true

      - name: Upload the failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-failure-${{ github.run_id }}
          path: failed-package.log
          if-no-files-found: ignore

      - name: Open the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PKG_VER: ${{ steps.build.outputs.pkgver }}
        run: |
          set -euo pipefail

          failed_jobs="$(gh run view -R "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" --json jobs --jq '[.jobs[] | select(.conclusion == "failure") | .name + ": " + ([.steps[] | select(.conclusion == "failure") | .name] | join(", "))] | join(" | ")')"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          title="[Pipeline] fallo de package.yml (${GITHUB_SHA::7})"
          body="Fallo de build, prueba o publicación en el pipeline del paquete.

          - Run: $run_url
          - Trabajo y pasos fallidos: $failed_jobs
          - Log adjunto: artifact package-failure-$GITHUB_RUN_ID del run.
          - Versión empaquetada: ${PKG_VER:-desconocida}"

          if gh issue list -R "$GITHUB_REPOSITORY" --state open --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "ya existe un issue abierto para este fallo: $title"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
